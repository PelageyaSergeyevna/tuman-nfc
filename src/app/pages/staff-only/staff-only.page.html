<app-page-header title="This app is for staff"></app-page-header>

<ion-content>
  <div class="tuman-page tuman-page-narrow">
    <div class="tuman-panel tuman-notice">
      <ion-icon name="information-circle-outline" class="tuman-notice-icon"></ion-icon>
      <div class="tuman-panel-title">The app on the phone is for staff</div>
      <div class="tuman-panel-sub">
        HR Staff and Department Heads use it to scan cards and file check-ins.
        Your attendance records, your correction requests and everything else
        live in the web console.
      </div>
      <ion-button
        expand="block"
        class="tuman-btn"
        [href]="webAppUrl"
        target="_blank"
        rel="noopener"
      >
        <ion-icon slot="start" name="globe-outline"></ion-icon>
        Open the web console
      </ion-button>
    </div>
  </div>
</ion-content>
